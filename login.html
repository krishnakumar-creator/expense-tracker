<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sign In - DailySpends Commute & Expense Tracker</title>
  <meta name="description" content="Sign in to your DailySpends account to track your daily commute rides, transit tickets, chai breaks, and expenses.">
  <meta name="theme-color" content="#0a0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon-192.svg">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com;">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark" class="auth-page">

  <!-- Top Navigation (Theme Toggle) -->
  <div class="auth-nav-top">
    <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
      <span class="theme-icon-dark">🌙</span>
      <span class="theme-icon-light" style="display:none;">☀️</span>
    </button>
  </div>

  <div class="auth-card-wrapper">
    <div class="auth-card">
      
      <!-- Brand & Title Header -->
      <header class="auth-header">
        <div class="auth-brand-logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="4"></rect>
            <path d="M2 10h20"></path>
            <circle cx="16" cy="15" r="1.5" fill="currentColor"></circle>
          </svg>
        </div>
        <h1 class="auth-title">DailySpends</h1>
        <p class="auth-subtitle" id="authSubtitle">Sign in to track your rides, metro, food & daily expenses</p>
      </header>

      <!-- ================= SIGN IN FORM ================= -->
      <form id="signInForm" class="auth-form" onsubmit="return false;">
        <!-- Email Field -->
        <div class="auth-field">
          <label class="auth-label" for="signInEmail">Email or Username</label>
          <div class="auth-input-wrap">
            <span class="input-icon-left">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="signInEmail" 
              class="auth-input" 
              placeholder="name@example.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="auth-field">
          <div class="auth-label">
            <label for="signInPassword">Password</label>
          </div>
          <div class="auth-input-wrap">
            <span class="input-icon-left">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="signInPassword" 
              class="auth-input has-right-btn" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" data-target="signInPassword" title="Show/Hide Password" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options: Remember Me -->
        <div class="auth-options-row">
          <label class="checkbox-container">
            <input type="checkbox" id="rememberMe" checked>
            <span>Keep me signed in</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitSignInBtn" class="btn-auth-primary">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="toast-popup" style="display: none;">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Welcome back!</span>
  </div>

  <!-- Firebase SDKs (Compat version for zero-bundler setup) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Services -->
  <script src="firebase-config.js"></script>
  <script src="db.js"></script>
  <script src="auth.js"></script>

  <script>
    (function() {
      // 1. Check if already logged in
      if (window.Auth && window.Auth.isAuthenticated()) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
          window.Auth.logout(null);
          showToast('👋 You have been safely logged out.', '👋');
        } else {
          window.Auth.redirectIfAuthenticated('index.html');
          return;
        }
      }

      // 2. Theme Toggle Handling
      const savedSettings = localStorage.getItem('dailyspends_settings_v1');
      let currentTheme = 'dark';
      if (savedSettings) {
        try {
          const parsed = JSON.parse(savedSettings);
          if (parsed.theme) currentTheme = parsed.theme;
        } catch(e) {}
      }
      document.body.setAttribute('data-theme', currentTheme);
      updateThemeIcons(currentTheme);

      const themeToggleBtn = document.getElementById('themeToggleBtn');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
          document.body.setAttribute('data-theme', currentTheme);
          updateThemeIcons(currentTheme);
          try {
            let settings = {};
            if (savedSettings) settings = JSON.parse(savedSettings);
            settings.theme = currentTheme;
            localStorage.setItem('dailyspends_settings_v1', JSON.stringify(settings));
          } catch(e) {}
        });
      }

      function updateThemeIcons(theme) {
        const darkIcon = document.querySelector('.theme-icon-dark');
        const lightIcon = document.querySelector('.theme-icon-light');
        if (!darkIcon || !lightIcon) return;
        if (theme === 'dark') {
          darkIcon.style.display = 'inline';
          lightIcon.style.display = 'none';
        } else {
          darkIcon.style.display = 'none';
          lightIcon.style.display = 'inline';
        }
      }

      // 3. Password Visibility Toggles
      document.querySelectorAll('.toggle-password-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          const openIcon = btn.querySelector('.eye-open');
          const closedIcon = btn.querySelector('.eye-closed');
          
          if (input.type === 'password') {
            input.type = 'text';
            if (openIcon) openIcon.style.display = 'none';
            if (closedIcon) closedIcon.style.display = 'inline-block';
          } else {
            input.type = 'password';
            if (openIcon) openIcon.style.display = 'inline-block';
            if (closedIcon) closedIcon.style.display = 'none';
          }
        });
      });

      // 4. Sign In Handler
      const signInForm = document.getElementById('signInForm');
      const signInEmailInput = document.getElementById('signInEmail');
      const signInPasswordInput = document.getElementById('signInPassword');
      const rememberMeCheckbox = document.getElementById('rememberMe');
      const submitSignInBtn = document.getElementById('submitSignInBtn');

      signInForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = signInEmailInput.value.trim();
        const password = signInPasswordInput.value;
        const remember = rememberMeCheckbox.checked;

        submitSignInBtn.disabled = true;
        submitSignInBtn.innerHTML = `<span>Signing In...</span>`;

        try {
          const res = await window.Auth.login(email, password, remember);
          if (res.success) {
            showToast(`🎉 Welcome back, ${res.user.name}!`, '🎉');
            setTimeout(() => {
              window.Auth.redirectIfAuthenticated('index.html');
            }, 500);
          } else {
            showToast(res.error, '⚠️');
            submitSignInBtn.disabled = false;
            submitSignInBtn.innerHTML = `<span>Sign In</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>`;
          }
        } catch (err) {
          showToast('An error occurred during sign in.', '⚠️');
          submitSignInBtn.disabled = false;
          submitSignInBtn.innerHTML = `<span>Sign In</span>`;
        }
      });

      // 5. Toast Notification Helper
      let toastTimer = null;
      function showToast(message, icon = '✨') {
        const toast = document.getElementById('toastNotification');
        const msg = document.getElementById('toastMessage');
        const ic = document.getElementById('toastIcon');
        if (!toast || !msg) return;

        msg.textContent = message;
        if (ic) ic.textContent = icon;
        toast.style.display = 'flex';

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.style.display = 'none';
        }, 3200);
      }

    })();
  </script>
</body>
</html>
